<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Harvester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #e8ff47;
      --accent2: #ff6b35;
      --text: #e8e8f0;
      --muted: #666680;
      --success: #47ff9c;
      --error: #ff4747;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    header {
      margin-bottom: 56px;
    }

    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    h1 span {
      color: var(--accent);
      display: block;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 400;
      max-width: 400px;
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px;
      margin-bottom: 16px;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent);
    }

    label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      padding: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
      padding: 14px 28px;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0f;
    }

    .btn-primary:hover {
      background: #f5ff6b;
      transform: translateY(-1px);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Progress section */
    #status-section {
      display: none;
    }

    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      margin: 20px 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-bar.indeterminate {
      width: 40%;
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-150%); }
      100% { transform: translateX(350%); }
    }

    .status-text {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    /* Preview grid */
    #preview-section { display: none; }

    .section-title {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .url-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .url-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .url-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .url-dot.ok { background: var(--success); }
    .url-dot.bad { background: var(--error); }
    .url-dot.checking {
      background: var(--accent);
      animation: pulse 1s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .url-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .url-badge {
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid;
      flex-shrink: 0;
    }

    .url-badge.ok { color: var(--success); border-color: var(--success); }
    .url-badge.bad { color: var(--error); border-color: var(--error); }

    /* Stats row */
    .stats-row {
      display: flex;
      gap: 24px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 20px 0;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .success-msg {
      background: rgba(71,255,156,0.05);
      border: 1px solid rgba(71,255,156,0.2);
      padding: 16px 20px;
      color: var(--success);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      display: none;
    }

    .error-msg {
      background: rgba(255,71,71,0.05);
      border: 1px solid rgba(255,71,71,0.2);
      padding: 16px 20px;
      color: var(--error);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      display: none;
    }

    footer {
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: gap;
      gap: 12px;
    }

    .corner-deco {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 80px;
      height: 80px;
      border-right: 1px solid var(--accent);
      border-bottom: 1px solid var(--accent);
      opacity: 0.2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">⬡ Image Harvester</div>
      <h1>Paste URLs.<br><span>Get Images.</span></h1>
      <p class="subtitle">Drop a list of image URLs — one per line — and download them all as a single ZIP archive.</p>
    </header>

    <div class="card">
      <label>Image URLs — one per line</label>
      <textarea
        id="url-input"
        placeholder="https://example.com/photo1.jpg&#10;https://example.com/photo2.png&#10;https://cdn.site.com/image.webp&#10;..."
      ></textarea>

      <div class="actions">
        <button class="btn-primary" id="download-btn" onclick="startDownload()">
          ↓ Download All as ZIP
        </button>
        <button class="btn-secondary" id="preview-btn" onclick="previewUrls()">
          Preview URLs
        </button>
        <button class="btn-secondary" onclick="clearAll()">
          Clear
        </button>
      </div>
    </div>

    <div id="status-section" class="card">
      <div class="status-text" id="status-text">Preparing download…</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar indeterminate" id="progress-bar"></div>
      </div>
    </div>

    <div class="success-msg" id="success-msg"></div>
    <div class="error-msg" id="error-msg"></div>

    <div id="preview-section" class="card">
      <div class="section-title" id="preview-title">URL Preview</div>
      <div class="stats-row" id="stats-row" style="display:none">
        <div class="stat">
          <div class="stat-value" id="stat-valid">0</div>
          <div class="stat-label">Valid Images</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-invalid" style="color:var(--error)">0</div>
          <div class="stat-label">Invalid / Failed</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total URLs</div>
        </div>
      </div>
      <div class="url-list" id="url-list"></div>
    </div>

    <footer>
      <span>IMAGE HARVESTER v1.0</span>
      <span>All downloads processed server-side</span>
    </footer>
  </div>

  <div class="corner-deco"></div>

  <script>
    function getUrls() {
      return document.getElementById('url-input').value
        .split('\n')
        .map(u => u.trim())
        .filter(u => u.length > 0);
    }

    function showStatus(text) {
      const section = document.getElementById('status-section');
      section.style.display = 'block';
      document.getElementById('status-text').textContent = text;
    }

    function hideStatus() {
      document.getElementById('status-section').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = '✓ ' + msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 6000);
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = '✕ ' + msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 8000);
    }

    function setButtons(disabled) {
      document.getElementById('download-btn').disabled = disabled;
      document.getElementById('preview-btn').disabled = disabled;
    }

    async function startDownload() {
      const urls = getUrls();
      if (urls.length === 0) { showError('Please paste at least one URL.'); return; }

      setButtons(true);
      showStatus(`Fetching ${urls.length} image${urls.length > 1 ? 's' : ''}…`);
      document.getElementById('success-msg').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Unknown error' }));
          throw new Error(err.error || 'Download failed');
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `images_${Date.now()}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        showSuccess(`ZIP downloaded successfully with your images.`);
      } catch (err) {
        showError(err.message);
      } finally {
        hideStatus();
        setButtons(false);
      }
    }

    async function previewUrls() {
      const urls = getUrls();
      if (urls.length === 0) { showError('Please paste at least one URL.'); return; }

      const section = document.getElementById('preview-section');
      const list = document.getElementById('url-list');
      const statsRow = document.getElementById('stats-row');

      section.style.display = 'block';
      statsRow.style.display = 'none';
      list.innerHTML = '';
      setButtons(true);

      // Show placeholders
      urls.forEach(url => {
        const item = document.createElement('div');
        item.className = 'url-item';
        item.innerHTML = `
          <div class="url-dot checking"></div>
          <div class="url-text">${escHtml(url)}</div>
          <div class="url-badge" style="color:var(--muted);border-color:var(--muted)">checking</div>
        `;
        list.appendChild(item);
      });

      try {
        const res = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls: urls.slice(0, 20) }),
        });

        const results = await res.json();
        list.innerHTML = '';
        let valid = 0, invalid = 0;

        results.forEach(r => {
          const ok = r.valid;
          if (ok) valid++; else invalid++;
          const item = document.createElement('div');
          item.className = 'url-item';
          item.innerHTML = `
            <div class="url-dot ${ok ? 'ok' : 'bad'}"></div>
            <div class="url-text">${escHtml(r.url)}</div>
            <div class="url-badge ${ok ? 'ok' : 'bad'}">${ok ? 'image' : 'invalid'}</div>
          `;
          list.appendChild(item);
        });

        if (urls.length > 20) {
          const note = document.createElement('div');
          note.style.cssText = 'font-family:Space Mono,monospace;font-size:11px;color:var(--muted);padding:10px 14px;';
          note.textContent = `+ ${urls.length - 20} more URLs (preview limited to 20)`;
          list.appendChild(note);
          invalid += urls.length - 20;
        }

        document.getElementById('stat-valid').textContent = valid;
        document.getElementById('stat-invalid').textContent = urls.length > 20 ? `${invalid}*` : invalid;
        document.getElementById('stat-total').textContent = urls.length;
        statsRow.style.display = 'flex';

      } catch (err) {
        showError('Preview failed: ' + err.message);
      } finally {
        setButtons(false);
      }
    }

    function clearAll() {
      document.getElementById('url-input').value = '';
      document.getElementById('preview-section').style.display = 'none';
      document.getElementById('status-section').style.display = 'none';
      document.getElementById('success-msg').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
